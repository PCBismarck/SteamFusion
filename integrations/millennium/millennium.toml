[plugin]
id = "local.steamfusion.router"
name = "SteamFusion"
version = "0.1.0"
author = "SteamFusion"
description = "Route configured library games to the correct Steam account."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "SteamFusion.star"

[dev]
auto_restart = true
reload_steamui_when = "both"
